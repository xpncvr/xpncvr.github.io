<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Text Bubble Maker - Add a Speech Bubble to an Image or GIF Online</title>
    <meta name="description" content="Add a speech bubble cutout to the top of an image or GIF for Discord reaction memes. Free and processed in your browser with ffmpeg.wasm, so the file is never uploaded. Choose the bubble size, preview and download." />
    <link rel="canonical" href="https://xpncvr.github.io/tools/bubblify/bubblify-image.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Text Bubble Maker - Add a Speech Bubble to an Image or GIF" />
    <meta property="og:description" content="Add a speech bubble cutout to an image or GIF, free and in your browser. The file is processed locally and never uploaded." />
    <meta property="og:url" content="https://xpncvr.github.io/tools/bubblify/bubblify-image.html" />
    <meta property="og:image" content="https://xpncvr.github.io/assets/images/bubblify-preview.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="bubblify.js"></script>
    <style>
      .area {
        border: 2px dashed #ccc;
        padding: 20px;
        text-align: center;
        width: 15vw;
        height: 15vw;
      }
      .drop-area:hover {
        transform: scale(1.05);
        border-color: #666;
      }
      .container {
        display: grid;
        grid-template-columns: max-content max-content;
        align-items: baseline;
        gap: 10px;
      }
      .hidden {
        display: none;
      }
      .loader {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3498db;
        border-radius: 50%;
        width: 10px;
        height: 10px;
        animation: spin 1s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      body {
        background-color: #f5f5f5;
        transform: scale(1.3);
        transform-origin: top left;
      }

      button {
        padding: 5px;
        margin-bottom: 15px;
      }

      textarea {
        margin-bottom: 15px;
        width: 50%;
        max-width: 270px;
      }

      input[type="range"] {
        height: 5px;
        -webkit-appearance: none;
        background: #ccc;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Text Bubble Maker</h1>
    <button disabled id="load-button">Load ffmpeg-core (uses ~31 MB of bandwith)</button>
    <span id="load-progress">Load ffmpeg first</span>
    <div id="loader" class="loader"></div>
    <br />
    <br />
    <label for="quantity">Size:</label>
    <input type="number" id="input-size" name="input-size" min="1" max="50" value="35" />
    <br />
    <br />
    <button id="reset-button">Reset</button>
    <button disabled id="download-button">Download</button>
    <br />
    <div class="container">
      <div id="drop-area" class="area drop-area">
        <p>Drop a file here</p>
      </div>
      <img id="original-image" class="hidden" />
      <div id="preview-area" class="area">
        <p>Preview</p>
      </div>
      <img id="result-image" class="hidden" />
    </div>

    <br />
    <p>Info log:</p>
    <p id="log-div"></p>
  </body>
</html>
